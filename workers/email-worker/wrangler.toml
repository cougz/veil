name = "veil-email-worker"
main = "src/index.js"
compatibility_date = "2025-04-01"

[observability]
enabled = true

[triggers]
crons = ["0 2 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "veil-db"
database_id = "17141d5e-9cbc-4dce-ab8e-313c5ef96960"
migrations_dir = "../../migrations"

[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 100, period = 60 }
